{% extends "base.html" %}
{% block conteudo %}
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2>Cadastrar Usuário</h2>
            <hr>
            <form method="POST" action="{{ url_for('cadastrar_usuario') }}">
                {% if csrf_token is defined %}
                <input type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}">
                {% endif %}
                <div class="mb-3">
                    <label for="name" class="form-label">
                        Nome Completo
                    </label>
                </div>

            </form>
        </div>
    </div>
</div>
