{% extends "base.html" %}

{% block conteudo %}
        <h1>Salas Cadastradas no Sistema</h1>
<div class="border rounded-3 overflow-auto">

        <table class="table table-striped mb-0">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Nome</th>
                <th scope="col">Capacidade</th>
                <th scope="col">Tipo</th>
                <th scope="col">Descricao</th>
                <th scope="col">Ativo</th>
            </tr>

            {% for sala in salas %}
            <tr>
                <td>{{ sala.id_sala }}</td>
                <td>{{ sala.nome }}</td>
                <td>{{ sala.capacidade }}</td>
                <td>{{ sala.tipo }}</td>
                <td>{{ sala.descricao }}</td>
                <td>{{ sala.ativa }}</td>
            </tr>
            {% endfor %}
            </thead>
        </table>
  
</div>

 <a href="{{ url_for('dashboard')}}" class="btn btn-outline-secondary mt-3">
            Voltar
</a>

{% endblock %}
