{% extends "base.html" %}
{% block conteudo %}
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2>Editar Usuário</h2>
            <hr>
            <form method="POST" action="{{ url_for('editar_usuario', id_usuario=usuario.id_usuario) }}">
                {% if csrf_token is defined %}
                <input type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}">
                {% endif %}
                <div class="mb-3">
                    <label for="nome" class="form-label">
                        Nome
                    </label>
                    <input type="text"
                            id="nome"
                            name="nome"
                            class="form-control"
                            value="{{ usuario.nome }}"
                            maxlength="100"
                            required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        E-mail                    </label>
                    <input type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            value=" {{ usuario.email }} "
                            maxlength="128"
                            required>
                </div>

                <div class="mb-3">
                    <label for="id_perfil" class="form-label">
                        Perfil
                    </label>
                    <select
                            id="id_perfil"
                            name="id_perfil"
                            class="form-select"
                            required>
                        <option value="">
                            Selecione um perfil
                        </option>
                        {% for perfil in perfis %}
                            <option value="{{ perfil.id_perfil}} "
                                    {% if perfil.id_perfil == usuario.id_perfil %}
                                        selected
                                    {% endif %}>
                                {{ perfil.nome }}
                            </option>
                        {% endfor %}
                    </select>

                </div>

                <button type="submit" class="btn btn-success">
                    Salvar Alterações
                </button>

                <a href="{{ url_for("listar_usuarios ")}}" class="btn btn-secondary">
                    Voltar
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
