{% extends "base.html" %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    Editar Reserva #{{ reserva.id_reserva }}
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">
                            Sala
                        </label>
                        <select
                            name="id_sala"
                            class="form-select"
                            required>
                            
                            {% for sala in salas %}

                            <option value="{{ sala.id_sala }}"
                                    {% if sala.id_sala == reserva.id_sala %}
                                    selected
                                    {% endif %}>
                                    {{ sala.nome }}
                                </option>
                                {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Data da Reserva
                        </label>
                        <input type="date"
                                name="data_reserva"
                                class="form-control"
                                value="{{ reserva.data_reserva }}"
                                required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Hora de Inicio
                            </label>
                            <input type="time"
                                    name="hora_inicio"
                                    class="form-control"
                                    value="{{ reserva.hora_inicio }}"
                                    required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Hora de Término
                            </label>
                            <input type="time"
                                    name="hora_fim"
                                    class="form-control"
                                    value="{{ reserva.hora_fim }}"
                                    required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Finalidade
                        </label>
                        <textarea name="finalidade"
                                    class="form-control"
                                    rows="3"
                                    required>
                                    {{ reserva.finalidade}}
                        </textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            Salvar Alterações
                        </button>
                        <a href="{{ url_for('minhas_reservas') }}"
                            class="btn btn-secondary">
                            Voltar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
