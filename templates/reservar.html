<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>SENAC RESERVA</title>

        <!-- BOOTSTRAP -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    
    <body class="bg-light">
        <div class="container mt-5">
            <h2>RESERVA DE SALAS - SENAC</h2>

            <form action="/reservar" method="POST">

                <div class="mb-3">
                    <label class="form-label">Selecione a a sala</label>
                    <select name="id_sala" 
                            id="id_sala"
                            class="form-select"
                            required>
                            <option value="">Escolha uma sala</option>
                            {% for sala in salas %}
                                <option value="{{ sala.id_sala }}">
                                    {{ sala.nome }}
                                </option>
                            {% endfor %}
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Data da reserva</label>
                    <input type="date"
                            name="data_reserva"
                            class="form-control"
                            required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Hora de início</label>
                        <input type="time"
                                name="hora_inicio"
                                class="form-control"
                                required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Hora de término</label>
                        <input type="time"
                                name="hora_fim"
                                class="form-control"
                                required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Finalidade da reserva</label>
                    <textarea
                        name="finalidade"
                        class="form-control"
                        rows="3"
                        required></textarea>
                </div>

                <button type="submit" class="btn btn-success">
                    Confirmar reserva
                </button>

            </form>

            <form method="POST" action="{{ url_for('logout') }}">
                <button type="submit" class="btn btn-outline-danger">
                    Sair
                </button>
            </form>
        </div>

    </body>

</html>
