{% extends "base.html" %}

{% block conteudo %}
        <div class="container mt-5">
            <h2>RESERVA DE SALAS - SENAC</h2>

            <form action="/reservar" method="POST">

                <div class="mb-3">
                    <label class="form-label">Selecione a a sala</label>
                    <select name="id_sala" 
                            id="id_sala"
                            class="form-select"
                            required>
                            <option value="">Escolha uma sala</option>
                            {% for sala in salas %}
                                <option value="{{ sala.id_sala }}">
                                    {{ sala.nome }}
                                </option>
                            {% endfor %}
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Data da reserva</label>
                    <input type="date"
                            name="data_reserva"
                            class="form-control"
                            required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Hora de início</label>
                        <input type="time"
                                name="hora_inicio"
                                class="form-control"
                                required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Hora de término</label>
                        <input type="time"
                                name="hora_fim"
                                class="form-control"
                                required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Finalidade da reserva</label>
                    <textarea
                        name="finalidade"
                        class="form-control"
                        rows="3"
                        required></textarea>
                </div>

                <button type="submit" class="btn btn-success">
                    Confirmar reserva
                </button>

                <a href="{{ url_for('dashboard')}}" class="btn btn-outline-secondary">
                    Voltar
                </a>
            </form>
        </div>

  {% endblock %}
